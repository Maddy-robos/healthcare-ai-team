<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zctf-2026 · healthcare-ai-team</title>
<style>
  :root{--bg:#07131a;--grid:rgba(56,220,200,.07);--accent:#38dcc8;--warn:#ff5d73;--text:#cfe9e6;--muted:#6f8f8c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}
  body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);transition:opacity .5s}
  #boot pre{margin:0;padding:24px;max-width:680px;width:calc(100% - 32px);font-size:14px;line-height:1.7;white-space:pre-wrap;
    border:1px solid rgba(56,220,200,.3);border-radius:10px;background:rgba(0,0,0,.35);min-height:260px}
  .ok{color:var(--accent)} .warn{color:var(--warn)} .dim{color:var(--muted)}
  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;
    padding:12px 16px;font-size:12px;border-bottom:1px solid rgba(56,220,200,.2);background:rgba(7,19,26,.85);z-index:5}
  header b{color:var(--accent)}
  #status{color:var(--accent)}
  #status.locked{color:var(--warn);animation:blink .8s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block}
  #bubble{position:fixed;z-index:6;padding:10px 14px;background:#fff;color:#0b2530;border-radius:14px;
    font:600 15px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;max-width:250px;width:max-content;pointer-events:none;
    transform:translate(-50%,-100%);transition:opacity .2s;text-align:center}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:#fff;border-bottom:0}
  #ring{position:fixed;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border:2px solid var(--warn);border-radius:50%;
    pointer-events:none;z-index:7;opacity:0;transform:scale(1.8);transition:opacity .2s,transform .25s}
  #ring.on{opacity:1;transform:scale(1)}
  #ring::before,#ring::after{content:"";position:absolute;background:var(--warn)}
  #ring::before{left:50%;top:-10px;bottom:-10px;width:2px;margin-left:-1px;
    -webkit-mask:linear-gradient(#000 0 14px,transparent 14px calc(100% - 14px),#000 0);mask:linear-gradient(#000 0 14px,transparent 14px calc(100% - 14px),#000 0)}
  #ring::after{top:50%;left:-10px;right:-10px;height:2px;margin-top:-1px;
    -webkit-mask:linear-gradient(90deg,#000 0 14px,transparent 14px calc(100% - 14px),#000 0);mask:linear-gradient(90deg,#000 0 14px,transparent 14px calc(100% - 14px),#000 0)}
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:8;padding:8px 14px;border-radius:8px;font-size:13px;
    background:rgba(255,93,115,.15);border:1px solid var(--warn);color:#ffd3da;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:calc(100% - 32px);text-align:center}
  #toast.on{opacity:1}
  footer{position:fixed;bottom:8px;left:16px;right:16px;font-size:11px;color:var(--muted);z-index:5;text-align:center;pointer-events:none}
</style>
</head>
<body>

<div id="boot"><pre id="bootText"></pre></div>

<header>
  <span><b>healthcare-ai-team</b> / zctf-2026</span>
  <span>visitor ip: <b>127.0.0.1</b> <span class="dim">(no place like home)</span></span>
  <span><span id="coords">x:---- y:----</span> · <span id="status">TRACKING</span></span>
</header>

<svg id="stage" aria-label="A robot that points at your cursor">
  <g id="arm">
    <path id="armOutline" fill="none" stroke="#1b2a33" stroke-width="20" stroke-linecap="round"/>
    <path id="armFill" fill="none" stroke="#c9d6de" stroke-width="13" stroke-linecap="round"/>
  </g>
  <g id="robot">
    <path id="idleArmOutline" fill="none" stroke="#1b2a33" stroke-width="20" stroke-linecap="round"/>
    <path id="idleArmFill" fill="none" stroke="#c9d6de" stroke-width="13" stroke-linecap="round"/>
    <circle id="idleHand" r="12" fill="#e8eef2" stroke="#1b2a33" stroke-width="3"/>
    <!-- wheels/base -->
    <rect x="-48" y="-16" width="96" height="16" rx="8" fill="#1b2a33"/>
    <!-- scrubs body -->
    <rect x="-62" y="-152" width="124" height="140" rx="26" fill="#2bb3a3" stroke="#1b2a33" stroke-width="3"/>
    <path d="M-22 -152 L0 -122 L22 -152" fill="none" stroke="#1b2a33" stroke-width="3"/>
    <!-- badge -->
    <rect x="-46" y="-110" width="26" height="30" rx="4" fill="#fff" stroke="#1b2a33" stroke-width="2"/>
    <rect x="-36" y="-104" width="6" height="18" fill="#ff5d73"/><rect x="-42" y="-98" width="18" height="6" fill="#ff5d73"/>
    <!-- stethoscope -->
    <path d="M-30 -152 Q-34 -104 4 -96 Q34 -102 30 -152" fill="none" stroke="#24343f" stroke-width="4"/>
    <circle cx="6" cy="-92" r="7" fill="#c9d6de" stroke="#24343f" stroke-width="3"/>
    <!-- neck + head -->
    <rect x="-14" y="-168" width="28" height="20" fill="#9fb1bc" stroke="#1b2a33" stroke-width="3"/>
    <line x1="0" y1="-252" x2="0" y2="-276" stroke="#1b2a33" stroke-width="4"/>
    <circle id="antenna" cx="0" cy="-280" r="7" fill="#ff5d73" stroke="#1b2a33" stroke-width="3"/>
    <rect x="-58" y="-254" width="116" height="92" rx="28" fill="#e8eef2" stroke="#1b2a33" stroke-width="3"/>
    <rect x="-44" y="-238" width="88" height="56" rx="18" fill="#0b2530"/>
    <circle cx="-18" cy="-212" r="11" fill="#103a44"/><circle cx="18" cy="-212" r="11" fill="#103a44"/>
    <circle id="pupilL" r="6" fill="#38dcc8"/><circle id="pupilR" r="6" fill="#38dcc8"/>
    <path id="mouth" d="M-10 -193 Q0 -187 10 -193" fill="none" stroke="#38dcc8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="hand">
    <rect x="-64" y="-15" width="14" height="30" rx="4" fill="#9fb1bc" stroke="#1b2a33" stroke-width="3"/>
    <rect x="-54" y="-14" width="34" height="32" rx="11" fill="#e8eef2" stroke="#1b2a33" stroke-width="3"/>
    <path d="M-42 -2 h14 M-42 6 h14" stroke="#1b2a33" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-28" y="-14" width="28" height="12" rx="6" fill="#e8eef2" stroke="#1b2a33" stroke-width="3"/>
    <ellipse cx="-36" cy="-16" rx="10" ry="6" fill="#e8eef2" stroke="#1b2a33" stroke-width="3"/>
  </g>
</svg>

<div id="ring"></div>
<div id="bubble">We see you.</div>
<div id="toast"></div>
<footer>a hacktoberfest prank · nothing is collected, nothing leaves your browser</footer>

<script>
(() => {
  // ---------- fake boot sequence ----------
  const lines = [
    ['$ ./zctf-2026 --target visitor', ''],
    ['[ok] handshake with healthcare-ai-team relay', 'ok'],
    ['[ok] resolving visitor IP ........... 127.0.0.1', 'ok'],
    ['[..] geolocating .................... your chair', 'dim'],
    ['[ok] cross-checking EHR records ..... nope, HIPAA says no', 'ok'],
    ['[!!] visitor acquired.', 'warn'],
    ['launching visual confirmation...', 'dim'],
  ];
  const boot = document.getElementById('boot'), bootText = document.getElementById('bootText');
  let i = 0, done = false;
  const finishBoot = () => { if (done) return; done = true; boot.style.opacity = 0; setTimeout(() => boot.remove(), 500); };
  const next = () => {
    if (done) return;
    if (i >= lines.length) return setTimeout(finishBoot, 700);
    const s = document.createElement('span'); s.className = lines[i][1]; s.textContent = lines[i][0] + '\n';
    bootText.appendChild(s); i++; setTimeout(next, 380 + Math.random() * 320);
  };
  next();
  boot.addEventListener('pointerdown', finishBoot);

  // ---------- tracker ----------
  const $ = id => document.getElementById(id);
  const svg = $('stage'), robot = $('robot'), hand = $('hand');
  const bubble = $('bubble'), ring = $('ring'), statusEl = $('status'), coords = $('coords'), toast = $('toast');
  const quips = [
    'We see you.', 'Found you.', 'Right there.', 'Nice cursor.', 'Yep, that one.',
    'Your IP is 127.0.0.1. There’s no place like home.',
    'Stop moving. Got it.', 'Logging that… (not really).', 'Clinically confirmed: a cursor.',
    'Our AI triaged you. You’re fine.', 'Hello, visitor.'
  ];
  let W = innerWidth, H = innerHeight;
  let mouse = { x: W * 0.6, y: H * 0.4 }, aim = { ...mouse };
  let robotX = W * 0.2, robotTarget = W * 0.2, locked = false, lockTimer = null, quipIdx = 0, toastTimer = null;

  const resize = () => { W = innerWidth; H = innerHeight; svg.setAttribute('viewBox', `0 0 ${W} ${H}`); };
  addEventListener('resize', resize); resize();

  const pickSide = () => { robotTarget = mouse.x < W / 2 ? W * 0.78 : W * 0.22; };
  const lock = () => {
    locked = true; pickSide();
    statusEl.textContent = 'LOCKED'; statusEl.classList.add('locked'); ring.classList.add('on');
    bubble.textContent = quips[quipIdx++ % quips.length];
  };
  const onMove = e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    coords.textContent = `x:${String(Math.round(mouse.x)).padStart(4, '0')} y:${String(Math.round(mouse.y)).padStart(4, '0')}`;
    ring.style.left = mouse.x + 'px'; ring.style.top = mouse.y + 'px';
    if (locked) { locked = false; statusEl.textContent = 'TRACKING'; statusEl.classList.remove('locked'); ring.classList.remove('on'); bubble.textContent = 'Tracking…'; }
    clearTimeout(lockTimer); lockTimer = setTimeout(lock, 380);
  };
  addEventListener('pointermove', onMove);
  addEventListener('pointerdown', e => {
    onMove(e);
    toast.textContent = 'Click registered. Uploading to the cloud… jk.';
    toast.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('on'), 1600);
  });
  setTimeout(lock, 3800);

  const set = (el, a) => { for (const k in a) el.setAttribute(k, a[k]); };

  const frame = t => {
    const s = Math.min(1, Math.max(0.55, Math.min(W, H * 1.2) / 760));
    robotX += (robotTarget - robotX) * 0.07;
    const bob = Math.sin(t / 380) * 3 * s;
    const baseY = H - 6 + bob;
    aim.x += (mouse.x - aim.x) * 0.3; aim.y += (mouse.y - aim.y) * 0.3;

    robot.setAttribute('transform', `translate(${robotX} ${baseY}) scale(${s})`);

    // shoulder on the side facing the cursor
    const side = aim.x >= robotX ? 1 : -1;
    const sh = { x: robotX + side * 58 * s, y: baseY - 128 * s };
    let dx = aim.x - sh.x, dy = aim.y - sh.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    const tipDist = Math.max(95 * s, d - 12);
    const tip = { x: sh.x + ux * tipDist, y: sh.y + uy * tipDist };
    const wrist = { x: tip.x - ux * 58 * s, y: tip.y - uy * 58 * s };
    const sag = Math.min(40, tipDist * 0.12) * s;
    const c = { x: (sh.x + wrist.x) / 2, y: (sh.y + wrist.y) / 2 + sag };
    const armD = `M${sh.x} ${sh.y} Q${c.x} ${c.y} ${wrist.x} ${wrist.y}`;
    set($('armOutline'), { d: armD, 'stroke-width': 20 * s }); set($('armFill'), { d: armD, 'stroke-width': 13 * s });

    const ang = Math.atan2(uy, ux) * 180 / Math.PI;
    const flip = Math.abs(ang) > 90 ? -1 : 1;
    hand.setAttribute('transform', `translate(${tip.x} ${tip.y}) rotate(${ang}) scale(${s} ${s * flip})`);

    // resting arm on the other side
    const ix = -side * 58, idleD = `M${ix} -128 Q${ix - side * 18} -90 ${ix - side * 10} -58`;
    set($('idleArmOutline'), { d: idleD }); set($('idleArmFill'), { d: idleD });
    set($('idleHand'), { cx: ix - side * 10, cy: -52 });

    // eyes follow the cursor
    for (const [id, ex] of [['pupilL', -18], ['pupilR', 18]]) {
      const wx = robotX + ex * s, wy = baseY - 212 * s;
      const ex2 = aim.x - wx, ey2 = aim.y - wy, ed = Math.hypot(ex2, ey2) || 1;
      set($(id), { cx: ex + ex2 / ed * 4.5, cy: -212 + ey2 / ed * 4.5 });
    }
    $('mouth').setAttribute('d', locked ? 'M-12 -194 Q0 -184 12 -194' : 'M-9 -191 L9 -191');
    $('antenna').setAttribute('fill', (Math.floor(t / 400) % 2) ? '#ff5d73' : '#ffb3be');

    bubble.style.left = Math.min(W - 130, Math.max(130, robotX)) + 'px';
    bubble.style.top = (baseY - 296 * s) + 'px';
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
